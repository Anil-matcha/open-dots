name: vadoo-grok

services:
  postgres:
    image: postgres:17-alpine
    container_name: vadoo-grok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vadoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vadoo}
      POSTGRES_DB: ${POSTGRES_DB:-vadoo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vadoo} -d ${POSTGRES_DB:-vadoo}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
