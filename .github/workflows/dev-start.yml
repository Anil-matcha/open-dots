name: Development startup

on:
  pull_request:
    paths:
      - .github/workflows/dev-start.yml
      - scripts/**
      - backend/.env.example
  push:
    branches: [main]
    paths:
      - .github/workflows/dev-start.yml
      - scripts/**
      - backend/.env.example

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install 'cryptography>=50.0.1' 'python-dotenv>=1.2.3'
      - name: Check shell syntax
        run: |
          bash -n scripts/dev.sh
          sh -n scripts/dev.sh
      - name: Test development startup
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
